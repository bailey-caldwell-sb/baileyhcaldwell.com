# Static site: the sow-proposals build is not part of this repo, so no build step runs.
[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SOW Proposals redirects
[[redirects]]
  from = "/proposals/*"
  to = "/sow-proposals/index.html"
  status = 200

[[redirects]]
  from = "/admin/sow/*"
  to = "/sow-proposals/admin.html"
  status = 200

# PGL redirects (existing)
[[redirects]]
  from = "/pgl/*"
  to = "/pgl/:splat"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SOW Proposals specific headers
[[headers]]
  for = "/proposals/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-cache, no-store, must-revalidate"

[[headers]]
  for = "/admin/sow/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-cache, no-store, must-revalidate"
