                    <p><strong>Lunatide</strong> shows the tide where you are — over a live satellite view of your coastline — with moon phases, solunar fishing times, 7-day surf forecasts and surf alerts.</p>
                </div>

                <h2>Getting help</h2>
                <p>Email <a href="mailto:bailey@baileyhcaldwell.com">bailey@baileyhcaldwell.com</a> with the place you were checking and a screenshot if you can. You'll usually hear back within a couple of days.</p>

                <h2>Frequently asked questions</h2>
                <h3>Where does Lunatide work?</h3>
                <p>Tide predictions come from NOAA, which covers U.S. coasts and territories. Weather comes from the National Weather Service (U.S. only). Surf forecasts work on most coastlines.</p>

                <h3>Why is my tide station far away?</h3>
                <p>Lunatide uses the closest NOAA prediction station. Tap the location name at the top of the app to search for a specific beach, harbor or address.</p>

                <h3>How do I get surf alerts?</h3>
                <p>Open the Surf forecast and turn on Surf alerts at the bottom. Choose "Good or better" or "Epic only." You'll get a notification about 90 minutes before a session that meets your bar.</p>

                <h3>How do I add the widget?</h3>
                <p>Press and hold your Home Screen, tap Edit → Add Widget, and search for Lunatide. The large widget shows the tide curve, moon phase, fishing rating and next highs and lows.</p>

                <h3>Is it accurate enough for boating?</h3>
                <p>Lunatide is for planning and enjoyment. Tides are predictions, and real water levels vary with wind, pressure and runoff. <strong>Not for navigation</strong> — always use official charts and current conditions on the water.</p>

                <h2>Privacy</h2>
                <p>Lunatide collects no personal data. Read the <a href="privacy.html">privacy policy</a>.</p>
