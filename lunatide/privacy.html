                    <p><strong>Lunatide</strong> — tides, moon, fishing and surf for iPhone<br>

                <h2>The short version</h2>
                <p>Lunatide does not collect, sell, or share your personal data. There are no accounts, no ads, no analytics, and no tracking. Your location never leaves your iPhone.</p>

                <h2>Location</h2>
                <p>With your permission, Lunatide uses your iPhone's location to find the nearest NOAA tide station. This happens on your device. Your location is not sent to the developer or stored on any server. You can instead type in a place, or turn location access off at any time in Settings → Privacy &amp; Security → Location Services.</p>

                <h2>Services the app contacts</h2>
                <p>To show forecasts, the app requests public data from these services. They receive the tide station's published coordinates or ID — not your own location:</p>
                <ul>
                    <li><strong>NOAA Tides &amp; Currents</strong> (U.S. government) — tide predictions and marine sensor readings</li>
                    <li><strong>National Weather Service</strong> (U.S. government) — current weather</li>
                    <li><strong>Open-Meteo</strong> — surf, swell and wind forecasts</li>
                    <li><strong>Apple Maps</strong> — satellite imagery and address search, under <a href="https://www.apple.com/legal/privacy/">Apple's privacy policy</a></li>
                </ul>
                <p>Like any website, these services can see the network address of the request. Lunatide sends them no identifiers, account information, or personal data.</p>

                <h2>Data stored on your iPhone</h2>
                <p>Lunatide keeps recent forecasts, your chosen place, and your settings on your device so it works offline. This stays on your iPhone and is deleted when you delete the app.</p>

                <h2>Notifications</h2>
                <p>Surf alerts are scheduled on your iPhone from the forecast it downloads. No push service or server is involved, and you can turn alerts off in the app or in Settings.</p>

                <h2>Children</h2>
                <p>Lunatide is suitable for all ages and collects no personal information from anyone, including children under 13.</p>

                <h2>Changes</h2>
                <p>If this policy changes, the updated version will be posted on this page with a new date.</p>

                <h2>Contact</h2>
